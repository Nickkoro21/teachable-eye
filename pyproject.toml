[project]
name = "teachable-eye"
version = "0.1.0"
description = "A teachable visual memory on the device (Qdrant Edge)."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Memory. Beta: pinned exactly (see specs/tech-stack.md).
    "qdrant-edge-py==0.7.2",
    # Encoders. Pinned: recognition thresholds are calibrated against them.
    "fastembed==0.8.0",
    "numpy==2.5.1",
    "onnx-asr==0.12.0",
    # onnxruntime-gpu (CUDA 13) on Windows / Linux x86_64, CPU build elsewhere.
    # Both ship the same `onnxruntime` module, so the CPU one is overridden away.
    "onnxruntime==1.27.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64')",
    # CUDA/cuDNN DLLs come from the torch cu130 wheel (torch/lib): import torch first.
    "onnxruntime-gpu==1.27.0; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    # Detection + tracking.
    "ultralytics>=8.4.96",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "lap>=0.5.13",
    "opencv-python>=5.0.0.93",
    "pillow==12.3.0",
    # Server.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=46.0.0",
    "python-dotenv>=1.2.2",
    # Evaluation baseline (logistic regression).
    "scikit-learn>=1.6",
    "transformers>=4.56",
    "anthropic>=1.15.0",
]

[project.scripts]
teachable-eye = "teachable_eye.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teachable_eye"]

[tool.uv]
override-dependencies = [
    "onnxruntime==1.27.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64')",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the real models (slow, downloads weights)",
]
addopts = "-m 'not gpu'"
